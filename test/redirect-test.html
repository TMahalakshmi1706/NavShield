<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirect Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            padding: 12px 25px;
            margin: 15px 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Redirect Test Page</h1>

    <p>
        This page is being used to test
        PhishCatcher's redirect detection.
    </p>

    <p>
        Do you want to continue to the destination page?
    </p>

    <button id="continueButton">
        Continue
    </button>

    <button id="backButton">
        Go Back
    </button>


    <script>

        document
            .getElementById("continueButton")
            .addEventListener("click", function () {

                /*
                 * Client-side redirect.
                 *
                 * This changes the browser URL and should
                 * allow PhishCatcher to detect the redirect.
                 */

                window.location.replace(
                    "http://g00gle.com/"
                );

            });


        document
            .getElementById("backButton")
            .addEventListener("click", function () {

                window.history.back();

            });

    </script>

</body>
</html>
