<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .container {
            max-width: 700px;
            margin: 160px auto;
            padding: 20px;
            text-align: center;
        }

        p {
            margin: 28px 0;
            line-height: 1.6;
        }

        a {
            color: #000000;
            text-decoration: underline;
            cursor: pointer;
        }

        a:hover {
            color: #333333;
        }
    </style>
</head>

<body>

    <div class="container">

        <p>
            To continue, please
            <a href="https://httpbin.org/redirect-to?url=https%3A%2F%2Fwww.amazon.com%2F">
                click here
            </a>.
        </p>

        <p>
            If you do not wish to continue, please
            <a href="#" onclick="history.back(); return false;">
                click here to go back
            </a>.
        </p>

    </div>

</body>
</html>
