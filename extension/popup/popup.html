<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishCatcher</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>PhishCatcher</h1>
            <p>Phishing Website Detection</p>
        </header>

        <main class="content">

            <div class="status-box">
                <span id="status">Analyzing current page...</span>
            </div>

            <div class="result-card">

                <div class="result-label">
                    Detection Result
                </div>

                <div id="result" class="result">
                    —
                </div>

            </div>

            <div class="details">

                <div class="detail-row">
                    <span class="label">URL</span>
                    <span id="url" class="value">
                        —
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Phishing Probability</span>
                    <span id="probability" class="value">
                        —
                    </span>
                </div>

            </div>

        </main>

        <footer class="footer">
            <span>PhishCatcher v1.0</span>
        </footer>

    </div>

    <script src="popup.js"></script>

</body>
</html>
