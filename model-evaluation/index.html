<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NavShield - Model Evaluation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #1f2937;
        }


        /* ====================================================
           LANDING PAGE
           ==================================================== */

        #landingPage {

            min-height: 100vh;

            width: 100%;

            position: relative;

            overflow: hidden;

            background-color: #061522;

            background-image:
                url("/image.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;
        }


        .landing-content {

            position: absolute;

            left: 9%;

            top: 33%;

            transform: translateY(-50%);

            width: 430px;

            color: #ffffff;

            text-align: left;

            z-index: 2;
        }


        .landing-project-name {

            margin: 0 0 8px;

            font-size: 52px;

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: 0.3px;

            color: #ffffff;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.35);
        }


        .landing-title {
            margin: 0 0 28px;

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 25px;

            line-height: 1.25;

            font-weight: 400;

            letter-spacing: 0.5px;

            color: #dcefff;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.4);
        }


        .proceed-button {

            padding:
                12px 22px;

            border:
                1px solid
                rgba(104, 207, 255, 0.75);

            border-radius: 6px;

            background:
                rgba(9, 57, 82, 0.78);

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.25);

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }


        .proceed-button:hover {

            background:
                rgba(12, 83, 116, 0.9);

            border-color:
                rgba(126, 220, 255, 0.95);
        }


        /* ====================================================
           EVALUATION PAGE
           ==================================================== */

        #evaluationPage {

            display: none;

            min-height: 100vh;

            background: #f5f7fb;

            padding: 55px 0;
        }


        .container {

            width: 90%;

            max-width: 820px;

            margin: 0 auto;
        }


        .header {

            text-align: center;

            margin-bottom: 35px;
        }


        .header h1 {

            margin: 0;

            font-size: 32px;
        }


        .header p {

            margin-top: 10px;

            color: #6b7280;

            font-size: 15px;
        }


        /* ====================================================
           CARDS
           ==================================================== */

        .card {

            background: #ffffff;

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.07);
        }


        .card h2 {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 20px;
        }


        /* ====================================================
           MODEL INFORMATION
           ==================================================== */

        .status {

            margin-bottom: 20px;

            font-weight: bold;
        }


        .model-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }


        .info-box {

            background: #f8fafc;

            padding: 16px;

            border-radius: 8px;
        }


        .info-label {

            display: block;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 6px;
        }


        .info-value {

            font-size: 19px;

            font-weight: bold;
        }


        /* ====================================================
           URL PREDICTION
           ==================================================== */

        .input-area {

            display: flex;

            gap: 10px;
        }


        input {

            flex: 1;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #2563eb;
        }


        .check-button {

            padding:
                13px 22px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: #ffffff;

            font-size: 15px;

            cursor: pointer;
        }


        .check-button:hover {

            background: #1d4ed8;
        }


        .check-button:disabled {

            background: #9ca3af;

            cursor: not-allowed;
        }


        /* ====================================================
           RESULT
           ==================================================== */

        .result {

            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #f8fafc;

            border-radius: 8px;
        }


        .result-row {

            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            padding: 13px 0;

            border-bottom:
                1px solid #e5e7eb;
        }


        .result-row:last-child {

            border-bottom: none;
        }


        .result-label {

            color: #6b7280;
        }


        .result-value {

            font-weight: bold;

            text-align: right;

            word-break: break-word;
        }


        .prediction-phishing {

            color: #dc2626;
        }


        .prediction-legitimate {

            color: #15803d;
        }


        .error {

            color: #dc2626;

            margin-top: 15px;

            font-size: 14px;
        }


        /* ====================================================
           RESPONSIVE
           ==================================================== */

        @media (max-width: 800px) {

            #landingPage {

                background-position:
                    center center;
            }


            .landing-content {

                left: 7%;

                top: 38%;

                width: 390px;
            }


            .landing-project-name {

                font-size: 44px;
            }


            .landing-title {

                font-size: 22px;
            }


            .model-grid {

                grid-template-columns: 1fr;
            }


            .input-area {

                flex-direction: column;
            }


            .check-button {

                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .landing-content {

                left: 50%;

                top: 32%;

                transform:
                    translate(-50%, -50%);

                width: 90%;

                text-align: center;
            }


            .landing-project-name {

                font-size: 40px;
            }


            .landing-title {

                font-size: 21px;

                margin-bottom: 24px;
            }


            .proceed-button {

                padding:
                    11px 18px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- ====================================================
         LANDING PAGE
         ==================================================== -->

    <section id="landingPage">


        <div class="landing-content">


            <div class="landing-project-name">

                NavShield

            </div>


            <h1 class="landing-title">

                Model Evaluation

            </h1>


            <button
                type="button"
                class="proceed-button"
                id="proceedButton"
            >

                Start Evaluation

            </button>


        </div>


    </section>



    <!-- ====================================================
         MODEL EVALUATION PAGE
         ==================================================== -->

    <section id="evaluationPage">


        <div class="container">


            <div class="header">

                <h1>

                    NavShield

                </h1>


                <p>

                    Trained Model Evaluation

                </p>

            </div>



            <!-- MODEL PERFORMANCE -->

            <div class="card">


                <h2>

                    Model Performance

                </h2>


                <div
                    id="modelStatus"
                    class="status"
                >

                    Loading model...

                </div>


                <div class="model-grid">


                    <div class="info-box">

                        <span class="info-label">

                            Algorithm

                        </span>


                        <span
                            id="algorithm"
                            class="info-value"
                        >

                            --

                        </span>

                    </div>



                    <div class="info-box">

                        <span class="info-label">

                            Decision Trees

                        </span>


                        <span
                            id="estimators"
                            class="info-value"
                        >

                            --

                        </span>

                    </div>



                    <div class="info-box">

                        <span class="info-label">

                            Features

                        </span>


                        <span
                            id="features"
                            class="info-value"
                        >

                            --

                        </span>

                    </div>



                    <div class="info-box">

                        <span class="info-label">

                            Accuracy

                        </span>


                        <span
                            id="accuracy"
                            class="info-value"
                        >

                            --

                        </span>

                    </div>


                </div>

            </div>



            <!-- URL PREDICTION -->

            <div class="card">


                <h2>

                    URL Prediction

                </h2>


                <div class="input-area">


                    <input
                        id="urlInput"
                        type="text"
                        placeholder="Enter URL to check"
                    >


                    <button
                        id="checkButton"
                        class="check-button"
                        type="button"
                    >

                        Check URL

                    </button>


                </div>



                <div
                    id="errorMessage"
                    class="error"
                >

                </div>



                <div
                    id="result"
                    class="result"
                >


                    <div class="result-row">


                        <span class="result-label">

                            URL

                        </span>


                        <span
                            id="resultUrl"
                            class="result-value"
                        >

                            --

                        </span>


                    </div>



                    <div class="result-row">


                        <span class="result-label">

                            Prediction

                        </span>


                        <span
                            id="prediction"
                            class="result-value"
                        >

                            --

                        </span>


                    </div>


                </div>


            </div>


        </div>

    </section>



    <script>


        // ====================================================
        // ELEMENTS
        // ====================================================


        const landingPage =
            document.getElementById(
                "landingPage"
            );


        const evaluationPage =
            document.getElementById(
                "evaluationPage"
            );


        const proceedButton =
            document.getElementById(
                "proceedButton"
            );


        const modelStatus =
            document.getElementById(
                "modelStatus"
            );


        const algorithm =
            document.getElementById(
                "algorithm"
            );


        const estimators =
            document.getElementById(
                "estimators"
            );


        const features =
            document.getElementById(
                "features"
            );


        const accuracy =
            document.getElementById(
                "accuracy"
            );


        const urlInput =
            document.getElementById(
                "urlInput"
            );


        const checkButton =
            document.getElementById(
                "checkButton"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const result =
            document.getElementById(
                "result"
            );


        const resultUrl =
            document.getElementById(
                "resultUrl"
            );


        const prediction =
            document.getElementById(
                "prediction"
            );



        // ====================================================
        // OPEN EVALUATION PAGE
        // ====================================================

        proceedButton.addEventListener(
            "click",
            function() {

                landingPage.style.display =
                    "none";


                evaluationPage.style.display =
                    "block";


                loadModelInfo();

            }
        );



        // ====================================================
        // MODEL INFORMATION
        // ====================================================

        async function loadModelInfo() {

            try {

                const response =
                    await fetch(
                        "/api/model-info"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load model information."
                    );

                }


                const data =
                    await response.json();


                modelStatus.textContent =
                    "Model Status: Loaded";


                algorithm.textContent =
                    data.model_type ||
                    "Random Forest";


                estimators.textContent =
                    data.estimators ??
                    "300";


                features.textContent =
                    data.features ??
                    "21";


                let modelAccuracy =
                    data.accuracy;


                if (
                    typeof modelAccuracy ===
                    "number"
                ) {

                    if (
                        modelAccuracy <= 1
                    ) {

                        modelAccuracy =
                            modelAccuracy * 100;

                    }


                    accuracy.textContent =
                        modelAccuracy.toFixed(2)
                        + "%";

                }

                else {

                    accuracy.textContent =
                        "--";

                }

            }


            catch (error) {

                modelStatus.textContent =
                    "Model Status: Error";


                console.error(
                    error
                );

            }

        }



        // ====================================================
        // URL PREDICTION
        // ====================================================

        async function checkURL() {

            const url =
                urlInput.value.trim();


            errorMessage.textContent =
                "";


            result.style.display =
                "none";


            if (!url) {

                errorMessage.textContent =
                    "Please enter a URL.";

                return;

            }


            checkButton.disabled =
                true;


            checkButton.textContent =
                "Checking...";


            try {

                const response =
                    await fetch(
                        "/api/predict",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    url: url
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        data.detail ||
                        "Prediction failed."
                    );

                }


                resultUrl.textContent =
                    data.url ||
                    url;


                prediction.textContent =
                    data.prediction ||
                    "--";


                prediction.className =
                    "result-value";


                const predictionText =
                    String(
                        data.prediction || ""
                    ).toLowerCase();


                if (
                    predictionText.includes(
                        "phishing"
                    )
                ) {

                    prediction.classList.add(
                        "prediction-phishing"
                    );

                }

                else if (
                    predictionText.includes(
                        "legitimate"
                    )
                ) {

                    prediction.classList.add(
                        "prediction-legitimate"
                    );

                }


                result.style.display =
                    "block";

            }


            catch (error) {

                errorMessage.textContent =
                    error.message ||
                    "Prediction failed.";

            }


            finally {

                checkButton.disabled =
                    false;


                checkButton.textContent =
                    "Check URL";

            }

        }



        // ====================================================
        // CHECK BUTTON
        // ====================================================

        checkButton.addEventListener(
            "click",
            checkURL
        );



        // ====================================================
        // ENTER KEY
        // ====================================================

        urlInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    checkURL();

                }

            }
        );

    </script>

</body>

</html>
